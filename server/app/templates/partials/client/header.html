<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
    <h2 style="margin:0">
        <span id="machine-alias" class="alias-display">{{ client.alias or client.hostname or client.mac }}</span>
        <button class="btn-small" id="edit-alias-btn">Editar nome</button>
    </h2>
    <div style="display:flex; gap:0.5rem; align-items:center">
        <button id="deploy-btn" class="btn-secondary">⚙ Configurar Deploy</button>
        <button id="execute-deploy-btn" class="btn-execute" disabled>▶ Executar</button>
    </div>
</div>
<div id="alias-form" style="display:none; margin-bottom:1rem">
    <form id="alias-edit-form">
        <input type="text" id="alias-input" placeholder="Nome do cliente" autocomplete="off" value="{{ client.alias or '' }}">
        <button type="submit">💾 Salvar</button>
        <button type="button" id="cancel-alias-btn" class="btn-small">Cancelar</button>
    </form>
</div>
