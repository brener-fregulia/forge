<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
    <div>
        <h2 style="margin:0 0 0.25rem 0">
            <span id="machine-alias" class="alias-display">{{ client.alias or client.hostname or client.mac }}</span>
            <button class="btn-small" id="edit-alias-btn">Editar nome</button>
        </h2>
        <div class="client-header-meta">
            <span class="meta-item"><strong>MAC</strong> <span id="meta-mac">{{ client.mac }}</span></span>
            <span class="meta-item"><strong>IP</strong> <span id="meta-ip">{{ client.ip }}</span></span>
            <span class="meta-item"><strong>Status</strong> <span id="meta-status" class="status status-{{ client.status }}">{{ client.status }}</span></span>
        </div>
    </div>
    <div style="display:flex; gap:0.5rem; align-items:center">
        <button id="deploy-btn" class="btn-secondary">
            <img src="/static/vendor/icons/settings.svg" class="btn-icon" alt="">
            Configurar Deploy
        </button>
        <button id="execute-deploy-btn" class="btn-execute" disabled>
            <img src="/static/vendor/icons/player-play.svg" class="btn-icon" alt="">
            Executar
        </button>
    </div>
</div>
<div id="alias-form" style="display:none; margin-bottom:1rem">
    <form id="alias-edit-form">
        <input type="text" id="alias-input" placeholder="Nome do cliente" autocomplete="off" value="{{ client.alias or '' }}">
        <button type="submit">
            <img src="/static/vendor/icons/device-floppy.svg" class="btn-icon" alt="">
            Salvar
        </button>
        <button type="button" id="cancel-alias-btn" class="btn-small">Cancelar</button>
    </form>
</div>
