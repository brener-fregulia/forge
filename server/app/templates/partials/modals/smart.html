<div id="smart-modal" class="modal-overlay">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h3>SMART</h3>
            <button class="modal-close" id="smart-modal-close">✕</button>
        </div>
        <div id="smart-modal-tabs">
            <div class="tabs-header" id="smart-tabs-header"></div>
            <div id="smart-tabs-content"></div>
        </div>
    </div>
</div>

<template id="smart-tab-btn-tpl">
    <button class="tab-btn"></button>
</template>

<template id="smart-panel-tpl">
    <div class="tab-panel smart-panel">
        <div class="smart-panel-header">
            <div class="smart-health-block">
                <div class="smart-health-status"></div>
                <div class="smart-health-pct"></div>
                <div class="smart-health-temp"></div>
            </div>
            <div class="smart-info-grid"></div>
        </div>
        <div class="smart-panel-table"></div>
    </div>
</template>

<template id="smart-info-row-tpl">
    <div class="smart-info-row">
        <span class="smart-info-label"></span>
        <span class="smart-info-value"></span>
    </div>
</template>

<template id="smart-table-tpl">
    <table class="smart-table forge-table">
        <thead>
            <tr>
                <th></th>
                <th>ID</th>
                <th>Atributo</th>
                <th>Valor Bruto</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</template>

<template id="smart-row-tpl">
    <tr>
        <td><span class="smart-dot"></span></td>
        <td class="smart-col-id"></td>
        <td class="smart-col-name"></td>
        <td class="smart-col-raw"></td>
    </tr>
</template>
